[project]
name = "ufirma"
version = "0.1.0"
description = "ufirma: pobieranie faktur z KSeF, budowa JPK_V7M i wysyłka do bramki e-Dokumenty"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "mbakalarski", email = "64490638+mbakalarski@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["ksef", "jpk", "jpk_v7m", "faktury", "vat", "e-faktura", "podatki"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Polish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "lxml>=5.3.0",
    "signxml>=5.1.0",
    "typer>=0.26.8",
]

[project.urls]
Homepage = "https://github.com/mbakalarski/ufirma"
Repository = "https://github.com/mbakalarski/ufirma"
Issues = "https://github.com/mbakalarski/ufirma/issues"

[project.scripts]
ufirma = "ufirma.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ksef", "jpk", "ufirma"]
# W sdist (poza kodem paczki) także testy i dokumentacja — żeby dało się
# zweryfikować wydanie ze źródeł pobranych z PyPI.
source-include = ["tests/**", "doc/**", "scripts/**", ".env.example"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["e2e: testy wymagające dostępu do środowiska testowego KSeF"]
