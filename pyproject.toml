[project]
name = "ksef"
version = "0.1.0"
description = "Klient KSeF (Krajowy System e-Faktur)"
readme = "README.md"
authors = [
    { name = "mbakalarski", email = "64490638+mbakalarski@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "signxml>=5.1.0",
]

[project.scripts]
ksef = "ksef:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["e2e: testy wymagające dostępu do środowiska testowego KSeF"]
