[project]
name = "ufirma"
version = "0.1.0"
description = "ufirma: pobieranie faktur z KSeF, budowa JPK_V7M i wysyłka do bramki e-Dokumenty"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "mbakalarski", email = "64490638+mbakalarski@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "signxml>=5.1.0",
    "typer>=0.26.8",
]

[project.scripts]
ufirma = "ufirma.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ksef", "jpk", "ufirma"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["e2e: testy wymagające dostępu do środowiska testowego KSeF"]
