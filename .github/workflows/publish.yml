# Release to PyPI, triggered by publishing a GitHub release (tag = version from
# pyproject.toml). Authentication uses Trusted Publishing (OIDC), so no API
# token is stored in secrets; the trusted publisher has to be configured once on
# pypi.org: owner `mbakalarski`, repository `ufirma`, workflow `publish.yml`,
# environment `pypi`. Manual runs default to TestPyPI (separate publisher).
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Target index
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m "not e2e"
      # GitHub switches scheduled workflows off after 60 days without activity
      # in a public repository, so the weekly MF check may be silently dead.
      # Re-check here: never publish a package whose bundled schema is no
      # longer the form MF applies.
      - run: python3 scripts/check_schemas.py --upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A release must ship the version it claims (tag v0.1.0 -> 0.1.0).
      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          version=$(uv version --short)
          tag=${GITHUB_REF_NAME#v}
          test "$version" = "$tag" || {
            echo "pyproject.toml version ($version) != release tag ($tag)" >&2
            exit 1
          }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  e2e:
    name: e2e against MF test environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      # Live KSeF and e-Dokumenty test environments. Runs in parallel with the
      # build and gates publishing: a release is the one moment where paying
      # for a slower, network-dependent check is clearly worth it. The suite is
      # self-sufficient (random NIP, self-signed certificate, no secrets).
      - run: uv run pytest -m e2e

  publish:
    name: Publish
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || inputs.repository }}
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: uv publish
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.repository }}" = "pypi" ]; then
            uv publish --trusted-publishing always
          else
            uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
          fi
