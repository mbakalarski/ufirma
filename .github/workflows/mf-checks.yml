# Weekly checks against live MF systems: whether MF published a newer form (or
# changed a schema served from a fixed URL), and whether the full e2e suite
# still passes against the KSeF and e-Dokumenty test environments.
name: MF checks

on:
  schedule:
    - cron: "17 5 * * 1" # Monday 05:17 UTC
  workflow_dispatch:

jobs:
  upstream:
    name: Newer forms and live schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The token only lifts the anonymous rate limit on the GitHub API call
      # that lists the KSeF invoice schemas; the script works without it.
      - run: python3 scripts/check_schemas.py --upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}

  e2e:
    name: e2e tests against MF test environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest
