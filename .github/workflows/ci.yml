name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testy offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m "not e2e"
