# Cotygodniowa kontrola zgodności z systemami MF: aktualność schematów XSD
# (crd.gov.pl, podatki.gov.pl, KSeF) oraz pełne testy e2e na środowiskach
# testowych KSeF i bramki e-Dokumenty.
name: Okresowa kontrola MF

on:
  schedule:
    - cron: "17 5 * * 1" # poniedziałek 05:17 UTC
  workflow_dispatch:

jobs:
  schematy:
    name: Aktualność schematów MF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_schemas.py

  e2e:
    name: Testy e2e na środowiskach testowych MF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest
